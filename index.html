<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ff8a3d" />
<title>Flagalogen · לומדים דגלים</title>

<!-- PWA / add-to-home-screen -->
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="icon-180.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Flagalogen" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,700;0,800;0,900;1,800&display=swap" rel="stylesheet">

<style>
  :root {
    --paper:      #fff3df;
    --paper-deep: #ffe7c2;
    --ink:        #3a2b52;
    --ink-soft:   #6d5f8c;
    --coral:      #ff5d6c;
    --coral-dk:   #e03e56;
    --tang:       #ff8a3d;
    --sun:        #ffc531;
    --sun-dk:     #e9a800;
    --teal:       #10b3a3;
    --teal-dk:    #0a8a7f;
    --sky:        #47c2ec;
    --mat:        #fbfcff;
    --turf:       #2aa15a;
    --turf-dk:    #1f8449;
    --board:      #23264a;

    --card-shadow: 0 22px 44px -18px rgba(58,43,82,.5), 0 6px 14px -8px rgba(58,43,82,.3);
    --radius: 28px;
    font-size: clamp(15px, 2.4vw, 21px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }

  body {
    font-family: "Nunito", ui-rounded, "Segoe UI", system-ui, sans-serif;
    font-weight: 800;
    color: var(--ink);
    background: var(--paper);
    height: 100dvh;
    overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
    padding: clamp(10px, 2.4vw, 26px);
    padding-top: max(clamp(10px,2.4vw,26px), env(safe-area-inset-top));
    padding-bottom: max(clamp(10px,2.4vw,26px), env(safe-area-inset-bottom));
    position: relative;
  }

  /* ---- Atmospheric background ---- */
  .bg { position: fixed; inset: 0; z-index: -3; overflow: hidden; }
  .bg::before { content: ""; position: absolute; top: -22vmax; right: -14vmax; width: 60vmax; height: 60vmax; border-radius: 50%;
    background: radial-gradient(circle at center, rgba(255,197,49,.9), rgba(255,138,61,.35) 45%, transparent 68%); }
  .bg::after { content: ""; position: absolute; bottom: -24vmax; left: -16vmax; width: 54vmax; height: 54vmax; border-radius: 50%;
    background: radial-gradient(circle at center, rgba(71,194,236,.5), rgba(16,179,163,.22) 48%, transparent 70%); }
  .dots { position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background-image: radial-gradient(rgba(58,43,82,.09) 1.4px, transparent 1.4px); background-size: 26px 26px;
    -webkit-mask-image: radial-gradient(ellipse at center, #000 55%, transparent 100%); mask-image: radial-gradient(ellipse at center, #000 55%, transparent 100%); }
  .doodle { position: fixed; z-index: -1; font-size: 2.2rem; opacity: .5; animation: float 7s ease-in-out infinite; }
  .doodle.d1 { top: 15%; left: 5%; animation-delay: -1s; }
  .doodle.d2 { top: 24%; right: 7%; animation-delay: -3s; font-size: 1.8rem; }
  .doodle.d3 { bottom: 14%; left: 9%; animation-delay: -2s; font-size: 1.7rem; }
  .doodle.d4 { bottom: 20%; right: 6%; animation-delay: -4.5s; }
  @keyframes float { 0%,100%{transform:translateY(0) rotate(-4deg);} 50%{transform:translateY(-14px) rotate(5deg);} }
  @media (max-width: 720px){ .doodle { display: none; } }

  h1 { margin: 0; }

  /* ---------- Header ---------- */
  .top { width: 100%; max-width: 760px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-bottom: clamp(6px, 1.6vh, 16px); animation: drop .6s cubic-bezier(.2,.9,.3,1.2) both; }
  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .globe { font-size: 2.2rem; animation: spin 16s linear infinite; transform-origin: 50% 55%; flex: 0 0 auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .brand-txt { line-height: .98; min-width: 0; }
  .brand-txt b { font-family: "Fredoka", sans-serif; font-size: 1.4rem; font-weight: 700; letter-spacing: .3px; display: block;
    color: var(--ink); text-shadow: 2px 2px 0 rgba(255,197,49,.55); white-space: nowrap; }
  .brand-txt span { font-size: .8rem; color: var(--ink-soft); font-weight: 800; }

  .modes { display: flex; gap: 5px; padding: 5px; background: #fff; border-radius: 999px; flex: 0 0 auto;
    box-shadow: 0 5px 0 var(--paper-deep), 0 12px 22px -12px rgba(58,43,82,.4); }
  .modes button { border: 0; cursor: pointer; font: inherit; font-weight: 800; font-size: .92rem;
    padding: 10px 16px; border-radius: 999px; color: var(--ink-soft); background: transparent;
    transition: transform .14s, color .14s, background .14s; display: inline-flex; align-items: center; gap: .35em; }
  .modes button.active { color: #fff; background: linear-gradient(180deg, var(--coral), var(--coral-dk)); box-shadow: 0 4px 0 var(--coral-dk); }
  .modes button:not(.active):hover { color: var(--ink); background: var(--paper); }
  .modes button:active { transform: scale(.93); }

  /* ---------- Countries pool toggle ---------- */
  .pool-toggle { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-bottom: clamp(4px, 1vh, 10px); animation: drop .6s cubic-bezier(.2,.9,.3,1.2) both; }
  .pool-label { font-size: .8rem; font-weight: 900; color: var(--ink-soft); }
  .pool-seg { display: flex; gap: 3px; padding: 3px; background: #fff; border-radius: 999px;
    box-shadow: 0 3px 0 var(--paper-deep); }
  .pool-btn { border: 0; cursor: pointer; font: inherit; font-weight: 800; font-size: .8rem;
    padding: 6px 14px; border-radius: 999px; color: var(--ink-soft); background: transparent;
    transition: transform .12s, color .14s, background .14s; }
  .pool-btn.active { color: #fff; background: linear-gradient(180deg, var(--teal), var(--teal-dk)); box-shadow: 0 3px 0 var(--teal-dk); }
  .pool-btn:not(.active):hover { color: var(--ink); background: var(--paper); }
  .pool-btn:active { transform: scale(.94); }

  /* ---------- Stage / no-scroll flex ---------- */
  .stage { flex: 1 1 auto; min-height: 0; width: 100%; max-width: 760px; display: flex; padding-top: 12px; }
  .screen { display: none; width: 100%; min-height: 0; }
  .screen.show { display: flex; flex-direction: column; justify-content: center; animation: pop .45s cubic-bezier(.2,.9,.3,1.35); }
  @keyframes pop { from { opacity: 0; transform: scale(.94) translateY(12px);} to { opacity: 1; transform: none; } }
  @keyframes drop { from { opacity: 0; transform: translateY(-16px);} to { opacity: 1; transform: none; } }

  .card { position: relative; background: #fff; border-radius: var(--radius); box-shadow: var(--card-shadow);
    padding: clamp(16px, 2.4vh, 30px) clamp(16px, 4vw, 38px) clamp(16px, 2.2vh, 26px); text-align: center;
    border: 3px solid #fff; display: flex; flex-direction: column; min-height: 0; max-height: 100%; }
  .card::before { content: ""; position: absolute; top: -14px; left: 50%; transform: translateX(-50%) rotate(-2.5deg);
    width: 122px; height: 28px; border-radius: 4px;
    background: repeating-linear-gradient(45deg, rgba(255,138,61,.85) 0 10px, rgba(255,197,49,.85) 10px 20px);
    box-shadow: 0 3px 8px rgba(58,43,82,.18); opacity: .92; }

  /* ---------- Names ---------- */
  .names { display: flex; flex-direction: column; align-items: center; gap: 9px; flex: 0 0 auto; }
  .name { display: inline-flex; align-items: center; gap: .5em; cursor: pointer; border: 0; font: inherit; color: inherit;
    padding: 6px 8px 6px 18px; border-radius: 999px; max-width: 100%;
    background: #fff2df; box-shadow: 0 3px 0 var(--paper-deep);
    transition: transform .12s, box-shadow .12s, background .16s; }
  .name-he { direction: rtl; padding: 6px 18px 6px 8px; background: #e7f7f4; box-shadow: 0 3px 0 #c9ece7; }
  .name:hover { background: #ffe7c4; }
  .name-he:hover { background: #d6f1ec; }
  .name:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--paper-deep); }
  .name-he:active { box-shadow: 0 1px 0 #c9ece7; }
  .name .txt { font-family: "Fredoka", sans-serif; font-weight: 600; }
  .name-en .txt { font-size: clamp(1.45rem, 4.8vw, 2.4rem); color: var(--ink); }
  .name-he .txt { font-size: clamp(1.25rem, 4.2vw, 1.95rem); color: var(--teal-dk); }
  /* filled circular "play audio" badge — the clear tap-to-hear affordance */
  .spk { width: 1.7em; height: 1.7em; flex: 0 0 auto; padding: .36em; border-radius: 50%;
    background: var(--tang); color: #fff; box-shadow: 0 3px 7px rgba(255,138,61,.5); opacity: 1;
    animation: spkHint 1.1s ease-in-out 3; transition: transform .15s; }
  .name-he .spk { background: var(--teal); box-shadow: 0 3px 7px rgba(16,179,163,.45); }
  .name:hover .spk { transform: scale(1.1); }
  .name.speaking { background: #fff2cf; }
  .name.speaking .spk { animation: spkHint .7s ease-in-out infinite; }
  .name.speaking .w1 { animation: pulse .7s ease-in-out infinite; }
  .name.speaking .w2 { animation: pulse .7s ease-in-out .18s infinite; }
  @keyframes pulse { 0%,100%{ opacity:.3; } 50%{ opacity:1; } }
  @keyframes spkHint { 0%,100%{ transform: scale(1);} 50%{ transform: scale(1.14);} }

  /* ---------- Flag ---------- */
  .flag-wrap { position: relative; align-self: center; flex: 0 1 auto; min-height: 0;
    width: min(74vw, 420px, 62vh); aspect-ratio: 3 / 2;
    margin: clamp(10px,1.8vh,20px) auto clamp(8px,1.4vh,14px);
    background: var(--mat); border-radius: 18px; padding: 12px;
    box-shadow: inset 0 0 0 2px rgba(58,43,82,.06), 0 14px 26px -14px rgba(58,43,82,.45);
    transform: rotate(-1.3deg); transition: transform .3s cubic-bezier(.2,.9,.3,1.2); }
  .flag-wrap:hover { transform: rotate(0deg) scale(1.02); }
  .flag-wrap img { width: 100%; height: 100%; object-fit: contain; display: block; border-radius: 7px;
    box-shadow: 0 3px 10px rgba(58,43,82,.22), 0 0 0 1px rgba(58,43,82,.1); background:#fff; }
  .flag-swap { animation: swap .5s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes swap { 0%{ opacity:0; transform: rotate(-1.3deg) translateY(16px) scale(.94);} 100%{ opacity:1; } }

  .hint { color: var(--ink-soft); font-weight: 800; font-size: .78rem; margin: 0 0 clamp(10px,1.6vh,16px); flex: 0 0 auto; }

  /* ---------- Controls ---------- */
  .controls { display: flex; align-items: center; justify-content: center; gap: 11px; flex-wrap: wrap; flex: 0 0 auto; }
  .btn { border: 0; cursor: pointer; font: inherit; font-weight: 900; font-size: .98rem; border-radius: 18px; padding: 13px 22px;
    color: #fff; display: inline-flex; align-items: center; gap: .5em; transition: transform .09s, box-shadow .09s, filter .15s; }
  .btn:active { transform: translateY(5px); }
  .btn.primary { background: linear-gradient(180deg, var(--sun), var(--sun-dk)); color: var(--ink); font-family:"Fredoka"; font-size: 1.2rem; padding: 14px 30px; box-shadow: 0 7px 0 var(--sun-dk); }
  .btn.primary:active { box-shadow: 0 2px 0 var(--sun-dk); }
  .btn.teal { background: linear-gradient(180deg, var(--teal), var(--teal-dk)); box-shadow: 0 6px 0 var(--teal-dk); }
  .btn.teal:active { box-shadow: 0 1px 0 var(--teal-dk); }
  .btn.ghost { background:#fff; color: var(--ink); box-shadow: 0 6px 0 var(--paper-deep); }
  .btn.ghost:active { box-shadow: 0 1px 0 var(--paper-deep); }
  .btn:disabled { opacity: .4; cursor: default; box-shadow: none !important; transform: none; }
  .btn:not(:disabled):hover { filter: brightness(1.04); }

  .counter { display: inline-flex; align-items:center; gap:.4em; margin-top: clamp(10px,1.6vh,16px); padding: 6px 15px; border-radius: 999px;
    background: var(--paper); color: var(--ink-soft); font-weight: 900; font-size: .8rem; align-self: center; flex: 0 0 auto; }

  /* ---------- Quiz ---------- */
  .scorebar { display: flex; justify-content: center; gap: 10px; margin-bottom: 12px; flex: 0 0 auto; animation: drop .5s both; }
  .stat { display:inline-flex; align-items:center; gap:.4em; background:#fff; padding: 8px 16px; border-radius: 999px; font-weight: 900; color: var(--ink); box-shadow: 0 5px 0 var(--paper-deep); font-size: .9rem; }
  .stat b { font-family:"Fredoka"; font-size: 1.25em; line-height: 1; }
  .stat.streak b { color: var(--coral); }
  .stat.score b { color: var(--tang); }

  .quiz-q { font-family:"Fredoka"; font-weight: 600; font-size: 1.25rem; margin: 0; flex: 0 0 auto; }
  .quiz-q small { display:block; color: var(--ink-soft); font-size: .8rem; font-family:"Nunito"; font-weight:800; direction: rtl; }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-top: 4px; flex: 0 0 auto; }
  .choice { border: 0; cursor: pointer; font: inherit; font-weight: 800; text-align: center; background: #fff; color: var(--ink);
    border-radius: 18px; padding: 13px 10px; box-shadow: 0 6px 0 var(--paper-deep); line-height: 1.12;
    transition: transform .09s, box-shadow .12s, background .18s; }
  .choice .en { font-family:"Fredoka"; font-weight: 600; font-size: 1.08rem; }
  .choice .he { display:block; color: var(--ink-soft); font-size: .88rem; direction: rtl; margin-top: 1px; font-weight: 800; }
  .choice:not([disabled]):hover { transform: translateY(-2px); background:#fffaf0; }
  .choice:not([disabled]):active { transform: translateY(4px); box-shadow: 0 2px 0 var(--paper-deep); }
  .choice.correct { background: linear-gradient(180deg, #2ecf9b, var(--teal-dk)); color:#fff; box-shadow: 0 6px 0 var(--teal-dk); animation: bounceIn .5s; }
  .choice.correct .he { color: rgba(255,255,255,.92); }
  .choice.wrong { background: linear-gradient(180deg, var(--coral), var(--coral-dk)); color:#fff; box-shadow: 0 6px 0 var(--coral-dk); animation: shake .4s; }
  .choice.wrong .he { color: rgba(255,255,255,.92); }
  @keyframes bounceIn { 0%{transform:scale(.9);} 50%{transform:scale(1.06);} 100%{transform:scale(1);} }
  @keyframes shake { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-7px);} 40%{transform:translateX(7px);} 60%{transform:translateX(-5px);} 80%{transform:translateX(5px);} }

  .feedback { min-height: 1.4em; font-family:"Fredoka"; font-weight:600; font-size: 1.12rem; margin-top: 12px; flex: 0 0 auto; }
  .feedback.good { color: var(--teal-dk); }
  .feedback.bad  { color: var(--coral-dk); }
  .feedback.hintline { color: var(--ink-soft); font-family: "Nunito"; font-weight: 800; font-size: .82rem; opacity: .9; }
  .feedback.pop { animation: fbPop .55s cubic-bezier(.2,.9,.3,1.6); }
  @keyframes fbPop { 0%{ transform: scale(.5); opacity: 0;} 55%{ transform: scale(1.18);} 100%{ transform: scale(1); opacity: 1;} }

  /* tappable single flag (Play) — reset button chrome, keep the mat look */
  .flag-wrap.tappable { border: 0; font: inherit; -webkit-appearance: none; appearance: none; cursor: pointer; }
  .flag-wrap.tappable:focus-visible { outline: 3px solid var(--teal); outline-offset: 4px; }
  .flag-wrap.qspeaking { animation: qflagSpeak .5s ease; }
  @keyframes qflagSpeak { 0%,100%{ transform: rotate(-1.3deg) scale(1);} 50%{ transform: rotate(-1.3deg) scale(1.04);} }

  /* ---------- Match (sports) ---------- */
  .scoreboard { display: flex; align-items: center; justify-content: center; gap: 14px; flex: 0 0 auto; margin-bottom: 12px;
    background: linear-gradient(180deg, #2b2f5a, var(--board)); color: #fff; border-radius: 16px; padding: 10px 18px;
    box-shadow: 0 8px 0 #171936, 0 16px 26px -14px rgba(0,0,0,.5); font-family: "Fredoka"; }
  .sb-side { font-weight: 600; font-size: .95rem; letter-spacing: .5px; display: inline-flex; align-items: center; gap: .3em; opacity: .95; }
  .sb-score { display: inline-flex; align-items: center; gap: 8px; background: #12142c; border-radius: 10px; padding: 3px 12px; box-shadow: inset 0 2px 6px rgba(0,0,0,.5); }
  .sb-score b { font-size: 1.5rem; color: var(--sun); text-shadow: 0 0 10px rgba(255,197,49,.6); min-width: .8em; }
  .sb-score i { color: #6b6f9c; font-style: normal; }

  .match-card { padding-top: clamp(14px,2vh,22px); }
  .pitch { position: relative; flex: 0 1 auto; min-height: 0; display: flex; align-items: stretch; justify-content: center; gap: clamp(8px,2vw,20px);
    background:
      repeating-linear-gradient(90deg, var(--turf) 0 26px, var(--turf-dk) 26px 52px);
    border-radius: 16px; padding: clamp(12px,2vh,20px) clamp(10px,2vw,18px);
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.35), inset 0 0 40px rgba(0,0,0,.18); }
  .pitch::before { content:""; position:absolute; left:50%; top:8%; bottom:8%; width:3px; transform:translateX(-50%); background:rgba(255,255,255,.55); }
  .team { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1 1 0; min-width: 0; }
  .team .flag-wrap { transform: rotate(0deg); width: 100%; max-width: 220px; margin: 0; background:#fff; padding: 8px; border-radius: 12px; cursor: pointer; border: 0; font: inherit; -webkit-appearance: none; appearance: none; display: block; }
  .team .flag-wrap:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
  .team .flag-wrap:hover { transform: scale(1.02); }
  .team .flag-wrap.speaking { animation: flagSpeak .5s ease; }
  @keyframes flagSpeak { 0%,100%{ transform: scale(1);} 50%{ transform: scale(1.05);} }
  .flag-spk { position: absolute; top: -9px; inset-inline-start: -9px; width: 30px; height: 30px; border-radius: 50%;
    background: var(--teal); color: #fff; display: grid; place-items: center; z-index: 4; pointer-events: none;
    box-shadow: 0 3px 7px rgba(16,179,163,.5), 0 0 0 3px #fff; animation: spkHint 1.1s ease-in-out 3; }
  .flag-spk svg { width: 16px; height: 16px; }
  .jersey { font-weight: 900; font-size: .72rem; color: #fff; letter-spacing: 1px; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
  .team-choices { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 230px; }
  .mchoice { border:0; cursor:pointer; font:inherit; font-weight:800; font-size:.9rem; color: var(--ink); background:#fff;
    border-radius: 12px; padding: 9px 8px; box-shadow: 0 4px 0 rgba(0,0,0,.18); line-height:1.05; transition: transform .08s, box-shadow .1s, background .15s; }
  .mchoice .he { display:block; font-size:.78rem; color: var(--ink-soft); direction:rtl; font-weight:800; }
  .mchoice:not([disabled]):hover { transform: translateY(-2px); }
  .mchoice:not([disabled]):active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
  .mchoice.correct { background: linear-gradient(180deg,#2ecf9b,var(--teal-dk)); color:#fff; box-shadow:0 4px 0 var(--teal-dk); }
  .mchoice.correct .he { color: rgba(255,255,255,.9); }
  .mchoice.wrong { background: linear-gradient(180deg,var(--coral),var(--coral-dk)); color:#fff; box-shadow:0 4px 0 var(--coral-dk); }
  .mchoice.wrong .he { color: rgba(255,255,255,.9); }
  .vs { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%) rotate(-6deg); z-index: 3;
    width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center;
    background: #fff; color: var(--coral); font-family:"Fredoka"; font-weight: 700; font-size: 1.15rem;
    box-shadow: 0 0 0 4px var(--coral), 0 8px 16px rgba(0,0,0,.35); }
  @media (max-width: 420px){ .vs { width: 44px; height: 44px; font-size: .95rem; box-shadow: 0 0 0 3px var(--coral), 0 6px 12px rgba(0,0,0,.35); } }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; }
  .footnote { flex: 0 0 auto; color: var(--ink-soft); font-size: .68rem; margin: 4px 0 0; text-align:center; font-weight:800; opacity:.85; min-height: 0; }
  .credit { flex: 0 0 auto; margin: 3px 0 0; text-align: center; font-size: .66rem; font-weight: 800; letter-spacing: .3px; color: var(--ink-soft); opacity: .6; }

  /* ---------- Small screens ---------- */
  @media (max-width: 520px) {
    :root { --radius: 22px; }
    .top { flex-direction: column; align-items: center; gap: 8px; }
    .globe { font-size: 1.7rem; }
    .brand { width: 100%; justify-content: center; }
    .brand-txt b { font-size: 1.2rem; text-shadow: 1.5px 1.5px 0 rgba(255,197,49,.55); }
    .brand-txt span { font-size: .68rem; }
    .modes { width: 100%; gap: 4px; padding: 4px; }
    .modes button { flex: 1 1 0; justify-content: center; padding: 10px 8px; font-size: .82rem; }
    .card { padding: 22px 14px 16px; }
    .controls { gap: 9px; }
    .controls .btn { flex: 1 1 0; justify-content: center; }
    .controls .btn.primary { flex: 1 1 100%; }
    .scoreboard { gap: 9px; padding: 8px 12px; }
    .sb-side { font-size: .82rem; }
    .team .flag-wrap { padding: 6px; }
    .mchoice { font-size: .84rem; padding: 8px 6px; }
  }
  @media (max-width: 380px){
    .modes button .lbl { display: none; }
    .modes button { padding: 9px 12px; font-size: 1rem; }
  }
  /* very short / landscape viewports: allow scrolling so controls stay reachable */
  @media (max-height: 560px){
    body { overflow: auto; }
    .stage { padding-top: 6px; }
  }
</style>
</head>
<body>
  <div class="bg"></div><div class="dots"></div>
  <div class="doodle d1">✈️</div><div class="doodle d2">🧭</div><div class="doodle d3">⭐</div><div class="doodle d4">☁️</div>

  <header class="top">
    <div class="brand">
      <div class="globe">🌍</div>
      <div class="brand-txt">
        <b>Flagalogen</b>
        <span>לומדים דגלים</span>
      </div>
    </div>
    <nav class="modes" role="tablist" aria-label="Game modes">
      <button id="tabLearn" role="tab" class="active" aria-selected="true" aria-controls="learn">📚<span class="lbl">&nbsp;Learn</span></button>
      <button id="tabPlay" role="tab" aria-selected="false" aria-controls="play">🎮<span class="lbl">&nbsp;Play</span></button>
      <button id="tabMatch" role="tab" aria-selected="false" aria-controls="match">⚽<span class="lbl">&nbsp;Match</span></button>
    </nav>
  </header>

  <div class="pool-toggle">
    <span class="pool-label">🌐 Countries</span>
    <span class="pool-seg" role="group" aria-label="How many countries to practice">
      <button id="poolMain" class="pool-btn active" aria-pressed="true">⭐ Main</button>
      <button id="poolAll" class="pool-btn" aria-pressed="false">🌍 All</button>
    </span>
  </div>

  <main class="stage">
    <!-- LEARN -->
    <section id="learn" class="screen show" role="tabpanel" aria-label="Learn flags">
      <div class="card">
        <div class="names">
          <button class="name name-en" id="learnEn"><span class="txt"></span>
            <svg class="spk" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9.5h3.2L12 5.5v13L7.2 14.5H4z" fill="currentColor"/><path class="wave w1" d="M15.2 9.2a4 4 0 010 5.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="wave w2" d="M17.8 6.6a7.5 7.5 0 010 10.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <button class="name name-he" id="learnHe" dir="rtl"><span class="txt"></span>
            <svg class="spk" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9.5h3.2L12 5.5v13L7.2 14.5H4z" fill="currentColor"/><path class="wave w1" d="M15.2 9.2a4 4 0 010 5.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="wave w2" d="M17.8 6.6a7.5 7.5 0 010 10.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="flag-wrap"><img id="learnFlag" alt="flag" /></div>
        <div class="hint">👆 Tap a name to hear it · לחצו על שם כדי לשמוע</div>
        <div class="controls">
          <button class="btn ghost" id="prevBtn">⬅️ Back</button>
          <button class="btn teal" id="shuffleBtn">🔀 Mix</button>
          <button class="btn primary" id="nextBtn">Next ➡️</button>
        </div>
        <div class="counter"><span id="learnCounter"></span></div>
      </div>
    </section>

    <!-- PLAY -->
    <section id="play" class="screen" role="tabpanel" aria-label="Flag quiz">
      <div class="scorebar">
        <span class="stat score">⭐ Score <b id="score">0</b></span>
        <span class="stat streak">🔥 Streak <b id="streak">0</b></span>
      </div>
      <div class="card">
        <div class="quiz-q">Which country is this?<small>איזו מדינה זו?</small></div>
        <button type="button" class="flag-wrap tappable" id="quizWrap" title="Tap to hear it in Hebrew" aria-label="Hear the country's name in Hebrew"><img id="quizFlag" alt="mystery flag" /><span class="flag-spk"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9.5h3.2L12 5.5v13L7.2 14.5H4z" fill="currentColor"/><path d="M15.2 9.2a4 4 0 010 5.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span></button>
        <div class="choices" id="choices"></div>
        <div class="feedback" id="feedback"></div>
        <div class="controls"><button class="btn primary" id="quizNext" style="display:none;">Next flag ➡️</button></div>
      </div>
    </section>

    <!-- MATCH -->
    <section id="match" class="screen" role="tabpanel" aria-label="Flag match-up">
      <div class="scoreboard">
        <span class="sb-side">🏠 HOME</span>
        <span class="sb-score"><b id="goalsH">0</b><i>:</i><b id="goalsA">0</b></span>
        <span class="sb-side">AWAY ✈️</span>
      </div>
      <div class="card match-card">
        <div class="quiz-q">Name both teams!<small>נחשו את שתי הקבוצות</small></div>
        <div class="pitch">
          <div class="team">
            <div class="jersey">🏠 HOME</div>
            <button type="button" class="flag-wrap" id="wrapH" title="Tap to hear it in Hebrew" aria-label="Hear the home team's name in Hebrew"><img id="flagH" alt="home flag" /><span class="flag-spk"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9.5h3.2L12 5.5v13L7.2 14.5H4z" fill="currentColor"/><path d="M15.2 9.2a4 4 0 010 5.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span></button>
            <div class="team-choices" id="choicesH"></div>
          </div>
          <div class="vs">VS</div>
          <div class="team">
            <div class="jersey">AWAY ✈️</div>
            <button type="button" class="flag-wrap" id="wrapA" title="Tap to hear it in Hebrew" aria-label="Hear the away team's name in Hebrew"><img id="flagA" alt="away flag" /><span class="flag-spk"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9.5h3.2L12 5.5v13L7.2 14.5H4z" fill="currentColor"/><path d="M15.2 9.2a4 4 0 010 5.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span></button>
            <div class="team-choices" id="choicesA"></div>
          </div>
        </div>
        <div class="feedback" id="matchFeedback"></div>
        <div class="controls"><button class="btn primary" id="matchNext" style="display:none;">Next match 🏁</button></div>
      </div>
    </section>
  </main>

  <p class="footnote" id="voiceNote"></p>
  <p class="credit">Brought to you by Uri &amp; Ellie Adam Glanz</p>
  <canvas id="confetti"></canvas>

<script>
(() => {
  "use strict";

  // "Main" = a curated, recognizable starter set for young kids.
  const MAIN_CODES = [
    "US","CA","MX","BR","AR","CL","CO","PE","JM","CU",
    "GB","FR","DE","IT","ES","PT","NL","BE","CH","SE",
    "NO","DK","FI","IE","GR","PL","AT","UA","RU",
    "IL","EG","TR","SA","AE","MA",
    "ZA","KE","NG","ET",
    "CN","JP","KR","IN","TH","VN","ID","PH",
    "AU","NZ"
  ];
  // "All" = all ~195 sovereign countries (193 UN members + Vatican + Palestine).
  const ALL_CODES = [
    "AF","AL","DZ","AD","AO","AG","AR","AM","AU","AT","AZ","BS","BH","BD","BB","BY",
    "BE","BZ","BJ","BT","BO","BA","BW","BR","BN","BG","BF","BI","CV","KH","CM","CA",
    "CF","TD","CL","CN","CO","KM","CG","CD","CR","CI","HR","CU","CY","CZ","DK","DJ",
    "DM","DO","EC","EG","SV","GQ","ER","EE","SZ","ET","FJ","FI","FR","GA","GM","GE",
    "DE","GH","GR","GD","GT","GN","GW","GY","HT","HN","HU","IS","IN","ID","IR","IQ",
    "IE","IL","IT","JM","JP","JO","KZ","KE","KI","KP","KR","KW","KG","LA","LV","LB",
    "LS","LR","LY","LI","LT","LU","MG","MW","MY","MV","ML","MT","MH","MR","MU","MX",
    "FM","MD","MC","MN","ME","MA","MZ","MM","NA","NR","NP","NL","NZ","NI","NE","NG",
    "MK","NO","OM","PK","PW","PS","PA","PG","PY","PE","PH","PL","PT","QA","RO","RU",
    "RW","KN","LC","VC","WS","SM","ST","SA","SN","RS","SC","SL","SG","SK","SI","SB",
    "SO","ZA","SS","ES","LK","SD","SR","SE","CH","SY","TJ","TZ","TH","TL","TG","TO",
    "TT","TN","TR","TM","TV","UG","UA","AE","GB","US","UY","UZ","VU","VA","VE","VN",
    "YE","ZM","ZW"
  ];
  const enNames = new Intl.DisplayNames(["en"], { type: "region" });
  const heNames = new Intl.DisplayNames(["he"], { type: "region" });
  const buildCountries = (codes) => codes.map(code => ({
    code, en: enNames.of(code), he: heNames.of(code),
    flag: `https://flagcdn.com/w640/${code.toLowerCase()}.png`,
    flag2x: `https://flagcdn.com/w1280/${code.toLowerCase()}.png`
  })).filter(c => c.en && c.he && c.en !== c.code && c.he !== c.code)
     .sort((a, b) => a.en.localeCompare(b.en)); // alphabetical for tidy Learn browsing

  let activePool = "main";
  try { const s = localStorage.getItem("flagPool"); if (s === "all" || s === "main") activePool = s; } catch (e) {}
  let COUNTRIES = buildCountries(activePool === "all" ? ALL_CODES : MAIN_CODES);

  // ---------- Speech ----------
  const synth = window.speechSynthesis;
  let voices = [], heVoice = null, enVoice = null;
  function pickVoices() {
    voices = synth ? synth.getVoices() : [];
    heVoice = voices.find(v => /^he/i.test(v.lang)) || null;
    enVoice = voices.find(v => /^en[-_]?(US|GB)/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang)) || null;
    const note = document.getElementById("voiceNote");
    if (!synth) note.textContent = "🔇 This browser can't read names aloud.";
    else if (!heVoice) note.textContent = "ℹ️ No Hebrew voice on this device — Hebrew may use a default voice.";
    else note.textContent = "";
  }
  if (synth) { pickVoices(); synth.onvoiceschanged = pickVoices; }
  let lastBtn = null;
  function speak(text, lang, btn) {
    if (!synth || !text) return;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    const v = lang.startsWith("he") ? heVoice : enVoice;
    if (v) u.voice = v;
    u.rate = 0.9; u.pitch = 1.06;
    if (lastBtn) lastBtn.classList.remove("speaking");
    if (btn) { btn.classList.add("speaking"); lastBtn = btn; u.onend = u.onerror = () => btn.classList.remove("speaking"); }
    synth.speak(u);
  }

  const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  const swapAnim = img => { img.classList.remove("flag-swap"); void img.offsetWidth; img.classList.add("flag-swap"); };
  const setFlag = (img, c) => { img.src = c.flag; img.srcset = `${c.flag} 640w, ${c.flag2x} 1280w`; img.alt = `Flag of ${c.en}`; swapAnim(img); };
  const distractors = (answerIdx, n) => shuffle(COUNTRIES.map((_,i)=>i).filter(i=>i!==answerIdx)).slice(0, n);

  // ---------- Learn ----------
  let order = COUNTRIES.map((_, i) => i);
  let pos = 0;
  const learnEn = document.getElementById("learnEn"), learnHe = document.getElementById("learnHe");
  const learnFlag = document.getElementById("learnFlag"), learnCounter = document.getElementById("learnCounter");
  function renderLearn(animate) {
    const c = COUNTRIES[order[pos]];
    learnEn.querySelector(".txt").textContent = c.en;
    learnHe.querySelector(".txt").textContent = c.he;
    learnFlag.src = c.flag; learnFlag.srcset = `${c.flag} 640w, ${c.flag2x} 1280w`; learnFlag.alt = `Flag of ${c.en}`;
    learnCounter.textContent = `${pos + 1} / ${COUNTRIES.length}`;
    document.getElementById("prevBtn").disabled = pos === 0;
    if (animate) swapAnim(learnFlag);
  }
  learnEn.onclick = () => speak(COUNTRIES[order[pos]].en, "en-US", learnEn);
  learnHe.onclick = () => speak(COUNTRIES[order[pos]].he, "he-IL", learnHe);
  document.getElementById("nextBtn").onclick = () => { pos = (pos+1)%COUNTRIES.length; renderLearn(true); };
  document.getElementById("prevBtn").onclick = () => { if (pos>0){ pos--; renderLearn(true); } };
  document.getElementById("shuffleBtn").onclick = () => { shuffle(order); pos = 0; renderLearn(true); };

  // ---------- Play ----------
  const quizFlag = document.getElementById("quizFlag"), choicesEl = document.getElementById("choices");
  const quizWrap = document.getElementById("quizWrap");
  const feedbackEl = document.getElementById("feedback"), quizNext = document.getElementById("quizNext");
  quizWrap.onclick = () => {
    if (answer == null) return;
    quizWrap.classList.remove("qspeaking"); void quizWrap.offsetWidth; quizWrap.classList.add("qspeaking");
    speak(COUNTRIES[answer].he, "he-IL");
  };
  const scoreEl = document.getElementById("score"), streakEl = document.getElementById("streak");
  let score = 0, streak = 0, answer = null, locked = false;
  const CHEERS = ["🎉 Yay!", "🌟 Awesome!", "👏 Great job!", "🥳 Correct!", "🚀 Nailed it!"];
  function newQuestion() {
    locked = false; feedbackEl.textContent = ""; feedbackEl.className = "feedback"; quizNext.style.display = "none";
    answer = Math.floor(Math.random()*COUNTRIES.length);
    const opts = shuffle([answer, ...distractors(answer, 3)]);
    setFlag(quizFlag, COUNTRIES[answer]); quizFlag.alt = "Mystery flag";
    choicesEl.innerHTML = "";
    opts.forEach(idx => {
      const o = COUNTRIES[idx];
      const b = document.createElement("button");
      b.className = "choice"; b.dataset.idx = idx;
      b.innerHTML = `<span class="en">${o.en}</span><span class="he" dir="rtl">${o.he}</span>`;
      b.onclick = () => choose(idx, b);
      choicesEl.appendChild(b);
    });
  }
  function choose(idx, btn) {
    if (locked) return; locked = true;
    const c = COUNTRIES[answer];
    [...choicesEl.children].forEach(b => b.disabled = true);
    if (idx === answer) {
      btn.classList.add("correct"); score++; streak++;
      feedbackEl.textContent = CHEERS[Math.floor(Math.random()*CHEERS.length)] + " " + c.en;
      feedbackEl.className = "feedback good pop"; speak(c.he, "he-IL"); celebrate();
    } else {
      btn.classList.add("wrong");
      [...choicesEl.children].find(b => +b.dataset.idx === answer)?.classList.add("correct");
      streak = 0; feedbackEl.textContent = "It's " + c.en + " · " + c.he; feedbackEl.className = "feedback bad"; speak(c.he, "he-IL");
    }
    scoreEl.textContent = score; streakEl.textContent = streak; quizNext.style.display = "";
  }
  quizNext.onclick = newQuestion;

  // ---------- Match ----------
  const flagH = document.getElementById("flagH"), flagA = document.getElementById("flagA");
  const wrapH = document.getElementById("wrapH"), wrapA = document.getElementById("wrapA");
  const choicesH = document.getElementById("choicesH"), choicesA = document.getElementById("choicesA");
  const goalsHEl = document.getElementById("goalsH"), goalsAEl = document.getElementById("goalsA");
  const matchFeedback = document.getElementById("matchFeedback"), matchNext = document.getElementById("matchNext");
  let mAns = { H: null, A: null }, mDone = { H: false, A: false };

  function buildTeam(side, imgEl, choicesBox) {
    const ans = Math.floor(Math.random()*COUNTRIES.length);
    mAns[side] = ans; mDone[side] = false;
    setFlag(imgEl, COUNTRIES[ans]);
    const opts = shuffle([ans, ...distractors(ans, 2)]);
    choicesBox.innerHTML = "";
    opts.forEach(idx => {
      const o = COUNTRIES[idx];
      const b = document.createElement("button");
      b.className = "mchoice"; b.dataset.idx = idx;
      b.innerHTML = `${o.en}<span class="he" dir="rtl">${o.he}</span>`;
      b.onclick = () => matchChoose(side, idx, b, choicesBox);
      choicesBox.appendChild(b);
    });
  }
  function newMatch() {
    matchFeedback.textContent = "👆 Tap a flag to hear it in Hebrew · לחצו על דגל";
    matchFeedback.className = "feedback hintline"; matchNext.style.display = "none";
    goalsHEl.textContent = "0"; goalsAEl.textContent = "0";
    // avoid the two teams being identical
    buildTeam("H", flagH, choicesH);
    do { buildTeam("A", flagA, choicesA); } while (mAns.A === mAns.H);
  }
  function speakFlagHe(side) {
    const idx = mAns[side]; if (idx == null) return;
    const wrap = side === "H" ? wrapH : wrapA;
    wrap.classList.remove("speaking"); void wrap.offsetWidth; wrap.classList.add("speaking");
    speak(COUNTRIES[idx].he, "he-IL");
  }
  wrapH.onclick = () => speakFlagHe("H");
  wrapA.onclick = () => speakFlagHe("A");
  function matchChoose(side, idx, btn, box) {
    if (mDone[side]) return; mDone[side] = true;
    const ans = mAns[side], c = COUNTRIES[ans];
    [...box.children].forEach(b => b.disabled = true);
    if (idx === ans) {
      btn.classList.add("correct");
      (side === "H" ? goalsHEl : goalsAEl).textContent = "1";
      burst();
    } else {
      btn.classList.add("wrong");
      [...box.children].find(b => +b.dataset.idx === ans)?.classList.add("correct");
    }
    speak(c.en, "en-US");
    if (mDone.H && mDone.A) fullTime();
  }
  function fullTime() {
    const h = goalsHEl.textContent === "1", a = goalsAEl.textContent === "1";
    const n = (h?1:0) + (a?1:0);
    matchFeedback.textContent = n === 2 ? "🏆 Full time — you named both!"
      : n === 1 ? "🙌 Full time — one right!"
      : "📣 Full time — try the next match!";
    matchFeedback.className = "feedback " + (n ? "good" : "bad");
    matchNext.style.display = "";
  }
  matchNext.onclick = newMatch;

  // ---------- Tabs ----------
  const tabs = { learn: "tabLearn", play: "tabPlay", match: "tabMatch" };
  let quizInit = false, matchInit = false;
  function setMode(mode) {
    if (synth) synth.cancel();
    Object.entries(tabs).forEach(([m, id]) => {
      const on = m === mode;
      const el = document.getElementById(id);
      el.classList.toggle("active", on); el.setAttribute("aria-selected", on);
      document.getElementById(m).classList.toggle("show", on);
    });
    if (mode === "play" && !quizInit) { quizInit = true; newQuestion(); }
    if (mode === "match" && !matchInit) { matchInit = true; newMatch(); }
  }
  document.getElementById("tabLearn").onclick = () => setMode("learn");
  document.getElementById("tabPlay").onclick = () => setMode("play");
  document.getElementById("tabMatch").onclick = () => setMode("match");

  // ---------- Countries pool (Main / All) ----------
  const poolMain = document.getElementById("poolMain"), poolAll = document.getElementById("poolAll");
  function syncPoolUI() {
    const main = activePool === "main";
    poolMain.classList.toggle("active", main); poolAll.classList.toggle("active", !main);
    poolMain.setAttribute("aria-pressed", main); poolAll.setAttribute("aria-pressed", !main);
  }
  function setPool(pool) {
    if (pool === activePool) return;
    activePool = pool;
    try { localStorage.setItem("flagPool", pool); } catch (e) {}
    syncPoolUI();
    if (synth) synth.cancel();
    COUNTRIES = buildCountries(pool === "all" ? ALL_CODES : MAIN_CODES);
    order = COUNTRIES.map((_, i) => i); pos = 0; renderLearn(true);
    // regenerate the games for the new pool
    if (document.getElementById("play").classList.contains("show")) newQuestion(); else quizInit = false;
    if (document.getElementById("match").classList.contains("show")) newMatch(); else matchInit = false;
  }
  poolMain.onclick = () => setPool("main");
  poolAll.onclick = () => setPool("all");
  syncPoolUI();

  // ---------- Confetti ----------
  const cv = document.getElementById("confetti"), ctx = cv.getContext("2d");
  let parts = [];
  const resize = () => { cv.width = innerWidth; cv.height = innerHeight; };
  resize(); addEventListener("resize", resize);
  const COLORS = ["#ffc531","#ff8a3d","#ff5d6c","#10b3a3","#47c2ec","#8a63d2"];
  const EMOJI = ["🎉","🎊","⭐","🌟","🥳"];
  function spawn(cx, cy, n, withEmoji) {
    for (let i=0;i<n;i++) {
      const isE = withEmoji && Math.random() < 0.22;
      parts.push({ x:cx, y:cy, vx:(Math.random()-.5)*(withEmoji?19:16), vy:(Math.random()-1)*16-3,
        g:.34+Math.random()*.22, r: isE ? 20+Math.random()*12 : 5+Math.random()*8,
        c:COLORS[(Math.random()*COLORS.length)|0], emoji: isE ? EMOJI[(Math.random()*EMOJI.length)|0] : null,
        rot:Math.random()*6, vr:(Math.random()-.5)*.5, life: withEmoji ? 120+Math.random()*30 : 100 });
    }
  }
  function burst() {                       // normal burst (Match)
    const running = parts.length > 0;
    spawn(innerWidth/2, innerHeight*0.42, 110, false);
    if (!running) requestAnimationFrame(tick);
  }
  function celebrate() {                    // BIG celebration + fanfare (Play)
    const running = parts.length > 0;
    spawn(innerWidth*0.50, innerHeight*0.38, 100, true);
    spawn(innerWidth*0.16, innerHeight*0.52, 55, true);
    spawn(innerWidth*0.84, innerHeight*0.52, 55, true);
    if (!running) requestAnimationFrame(tick);
    fanfare();
  }
  function tick() {
    ctx.clearRect(0,0,cv.width,cv.height);
    parts = parts.filter(p => p.life-- > 0 && p.y < cv.height+60);
    parts.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      if (p.emoji) { ctx.font = p.r+"px serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(p.emoji,0,0); }
      else { ctx.fillStyle = p.c; ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.62); }
      ctx.restore(); });
    if (parts.length) requestAnimationFrame(tick); else ctx.clearRect(0,0,cv.width,cv.height);
  }

  // ---------- Celebration sound (Web Audio, no files, offline-safe) ----------
  let audioCtx = null;
  function fanfare() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      audioCtx = audioCtx || new AC();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const now = audioCtx.currentTime;
      const tone = (freq, t, dur, type, vol) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + dur + 0.02);
      };
      const arp = [523.25, 659.25, 783.99, 1046.50]; // C5 E5 G5 C6
      arp.forEach((f, i) => tone(f, now + i * 0.085, 0.45, "triangle", 0.28));
      const t2 = now + arp.length * 0.085;           // sparkle chord to finish
      tone(1046.50, t2, 0.6, "sine", 0.22);
      tone(1318.51, t2, 0.6, "sine", 0.18);
    } catch (e) {}
  }

  renderLearn(false);

  // ---------- PWA service worker ----------
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
})();
</script>
</body>
</html>
