<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5d6c"/>
      <stop offset="0.55" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ffc531"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="256" cy="256" r="150"/></clipPath>
  </defs>

  <!-- full-bleed square; iOS/Android round the corners themselves -->
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- soft glow behind the globe -->
  <circle cx="256" cy="256" r="176" fill="#ffffff" opacity="0.16"/>

  <!-- globe -->
  <circle cx="256" cy="256" r="150" fill="#ffffff"/>
  <g clip-path="url(#disc)" stroke="#10b3a3" stroke-width="9" fill="none" stroke-linecap="round">
    <!-- parallels -->
    <line x1="106" y1="256" x2="406" y2="256"/>
    <line x1="121" y1="196" x2="391" y2="196"/>
    <line x1="121" y1="316" x2="391" y2="316"/>
    <!-- meridians -->
    <line x1="256" y1="106" x2="256" y2="406"/>
    <ellipse cx="256" cy="256" rx="62" ry="150"/>
    <ellipse cx="256" cy="256" rx="118" ry="150"/>
  </g>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#0a8a7f" stroke-width="10"/>

  <!-- little location pin, upper-left landmass -->
  <path d="M196 210c0-18 15-32 33-32s33 14 33 32c0 24-33 52-33 52s-33-28-33-52z" fill="#ff5d6c"/>
  <circle cx="229" cy="208" r="11" fill="#fff"/>
</svg>
